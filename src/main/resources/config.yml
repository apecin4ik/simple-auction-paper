# ╔══════════════════════════════════════════════════════════╗
# ║                    SimpleAuction                         ║
# ║                  Конфигурация аукциона                   ║
# ╚══════════════════════════════════════════════════════════╝

# ────────────── ⏳ ВРЕМЯ ЛОТОВ ──────────────
# Сколько часов лот висит на аукционе
active-hours: 24
# Сколько часов истёкший лот ждёт владельца, потом удаляется навсегда
expired-hours: 24

# ────────────── 📦 ЛИМИТЫ ЛОТОВ ──────────────
# Максимум одновременно активных лотов у обычного игрока
max-listings: 2

# Лимиты слотов по привилегиям.
# Выдаются через пермишен: simpleauction.slots.<группа>
# Если у игрока несколько привилегий, берётся наибольший лимит.
slots:
  default: 2
  groups:
    khrest: 5
    dvorean: 7
    boyar: 10
    voivod: 17
    jester: 20
    gosudar: 40
    velmozh: 50
    palatin: 60
    tsarev: 70

# ────────────── 💰 ЭКОНОМИКА ──────────────
# Комиссия аукциона в процентах (продавец получает цену минус комиссия)
commission-percent: 5
# Ограничения цены
min-price: 1
max-price: 1000000000

# ────────────── 🔑 ПРАВА (PERMISSIONS) ──────────────
# Для администратора (OP) достаточно: simpleauction.*
permissions:
  all: 'simpleauction.*'
  use: 'simpleauction.use'
  sell: 'simpleauction.sell'
  buy: 'simpleauction.buy'
  cancel: 'simpleauction.cancel'
  expired: 'simpleauction.expired'
  slots-book: 'simpleauction.slots'
  reload: 'simpleauction.reload'
  # Администрирование: снимать чужие лоты (Shift+ПКМ), обход лимитов
  admin: 'simpleauction.admin'
  slots-default: 'simpleauction.slots.default'
  slots-khrest: 'simpleauction.slots.khrest'
  slots-dvorean: 'simpleauction.slots.dvorean'
  slots-boyar: 'simpleauction.slots.boyar'
  slots-voivod: 'simpleauction.slots.voivod'
  slots-jester: 'simpleauction.slots.jester'
  slots-gosudar: 'simpleauction.slots.gosudar'
  slots-velmozh: 'simpleauction.slots.velmozh'
  slots-palatin: 'simpleauction.slots.palatin'
  slots-tsarev: 'simpleauction.slots.tsarev'

# ────────────── 🖼 РАСКЛАДКА МЕНЮ ──────────────
#   45        46  47  48   49   50  51  52        53
# [Книга] [ ] [ ] [ ◀ ] [🌻] [ ▶ ] [ ] [ ] [Истёкшие]
gui:
  filler:
    enabled: true
    material: GRAY_STAINED_GLASS_PANE
    name: ' '
  prev-button:
    slot: 48
    material: ARROW
  refresh-button:
    slot: 49
    material: SUNFLOWER
    glow: true
    name: '&e&l☀ Обновить'
    lore:
      - '&7Страница: &f{page}&7/&f{pages}'
      - '&7Всего лотов: &f{total}'
      - ''
      - '&e▶ Нажми, чтобы обновить список'
  next-button:
    slot: 50
    material: ARROW
  expired-button:
    slot: 53
    material: CHEST
    glow: false
  back-button:
    slot: 49
    material: BARRIER

